# Builds the Linux packages (.deb + AppImage) and attaches them to a DRAFT
# GitHub release. Review the draft on the Releases page, then click Publish.
#
# To cut a release:
#   1. Set the same version in src-tauri/tauri.conf.json, src-tauri/Cargo.toml
#      and package.json, and commit.
#   2. git tag v0.2.0 && git push origin v0.2.0
# Or run it by hand from the Actions tab ("Run workflow"); the draft is then
# named after the version in tauri.conf.json.
#
# Built on Ubuntu 22.04 on purpose: the binary links against that system's
# glibc, so it runs on Ubuntu 22.04+, Debian 12+, Mint 21+ and newer.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the draft release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(jq -r .version src-tauri/tauri.conf.json)
          tag=${GITHUB_REF_NAME#v}
          if [ "$app" != "$tag" ]; then
            echo "::error::Tag v$tag does not match version $app in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev libssl-dev libxdo-dev pkg-config file

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Generate third-party license notices
        run: node dev/third-party-licenses.mjs

      - name: Build and attach to draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Shellport v__VERSION__
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## Download

            | File | For |
            |---|---|
            | `Shellport_*_amd64.deb` | Ubuntu, Debian, Linux Mint, Pop!_OS: `sudo apt install ./Shellport_*_amd64.deb` |
            | `Shellport_*_amd64.AppImage` | Any 64-bit distribution: `chmod +x` it and run |

            Full install steps: https://github.com/${{ github.repository }}#install

            ## Verify your download

            Download `SHA256SUMS` into the same folder, then run:

            ```bash
            sha256sum --check --ignore-missing SHA256SUMS
            ```

            Licenses of the third-party software included in Shellport are listed in `THIRD_PARTY_LICENSES.md` (also attached).

            ## What's new

            <!-- Edit this draft before publishing. -->

      - name: Attach checksums and license notices
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle
          mkdir -p dist-release
          cp "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage dist-release/
          cp THIRD_PARTY_LICENSES.md dist-release/
          (cd dist-release && sha256sum *.deb *.AppImage > SHA256SUMS && cat SHA256SUMS)
          repo="${{ github.repository }}"
          # Upload by release ID: the release is still a draft, so it can't be looked up by tag.
          for f in SHA256SUMS THIRD_PARTY_LICENSES.md; do
            old=$(gh api "repos/$repo/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$f\") | .id")
            if [ -n "$old" ]; then gh api -X DELETE "repos/$repo/releases/assets/$old"; fi
            gh api -X POST "https://uploads.github.com/repos/$repo/releases/$RELEASE_ID/assets?name=$f" \
              -H "Content-Type: text/plain" --input "dist-release/$f" --jq .browser_download_url
          done
