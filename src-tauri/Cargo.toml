[package]
name = "shellport"
version = "0.1.0"
description = "SSH, SFTP and Docker client for Linux"
edition = "2021"

[lib]
name = "shellport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
bollard = "0.21"
portable-pty = "0.9"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
directories = "6"
base64 = "0.22"
futures-util = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
log = "0.4"

[dev-dependencies]
tempfile = "3"

# Keep debug builds small: line tables for our crate, no debug info for deps.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
